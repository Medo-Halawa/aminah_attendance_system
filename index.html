<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الحضور والانصراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface-2:#EDF3F2;
  --primary:#0F6E6A; --primary-dark:#0A4F4C; --primary-light:#E4F0EF;
  --accent:#E2653A; --accent-dark:#C24E28;
  --danger:#C1443C; --danger-light:#FBEAE8;
  --success:#2E7D32; --success-light:#E9F5EA;
  --text:#16302E; --muted:#5F7674; --border:#DCE6E4;
  --shadow:0 2px 10px rgba(15,110,106,.08);
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; font-size:15px;}
h1,h2,button,.card-title,.brand{font-family:'Cairo',sans-serif;}
button{cursor:pointer; font-family:'Cairo',sans-serif;}
input,select{font-family:'Tajawal',sans-serif; font-size:14.5px;}
.hidden{display:none !important;}

.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;}

.btn{border:none; border-radius:9px; padding:11px 18px; font-weight:700; font-size:14.5px;}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:7px;}

/* main app */
.app-wrap{max-width:760px; margin:0 auto; padding:28px 20px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand .mark{width:38px;height:38px;border-radius:10px;background:var(--primary); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:800;}
.topbar .brand .txt{font-weight:800; font-size:16px; color:var(--primary-dark);}
.clock{font-size:13px; color:var(--muted); font-weight:700; direction:ltr;}
.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;}
.badge.green{background:var(--success-light); color:var(--success);}
.badge.red{background:var(--danger-light); color:var(--danger);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.green{background:var(--success);} .dot.red{background:var(--danger);}

.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:var(--shadow); margin-bottom:20px;}
.card-title{font-size:16px; font-weight:800; color:var(--primary-dark); margin:0 0 4px;}
.card-desc{font-size:12.5px; color:var(--muted); margin:0 0 18px;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:700; margin-bottom:7px;}
.field input, .field select{width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:10px; background:#FCFEFE; font-size:16px;}
.field input:focus, .field select:focus{outline:none; border-color:var(--primary); background:#fff;}
.field .auto-note{font-size:11.5px; color:var(--success); margin-top:5px; font-weight:700; display:none;}
.field .auto-note.show{display:block;}

.action-btns{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
.action-btns button{padding:20px 10px; font-size:16px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:6px;}
.action-btns .ic{font-size:26px;}
.btn-checkin{background:var(--success-light); color:var(--success); border:2px solid var(--success);}
.btn-checkin:hover{background:var(--success); color:#fff;}
.btn-checkin:disabled{opacity:.5; cursor:not-allowed;}
.btn-checkout{background:var(--danger-light); color:var(--danger); border:2px solid var(--danger);}
.btn-checkout:hover{background:var(--danger); color:#fff;}
.btn-checkout:disabled{opacity:.5; cursor:not-allowed;}

.status-msg{margin-top:16px; padding:12px 16px; border-radius:10px; font-size:13.5px; font-weight:700; display:none;}
.status-msg.show{display:block;}
.status-msg.success{background:var(--success-light); color:var(--success);}
.status-msg.error{background:var(--danger-light); color:var(--danger);}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{background:var(--surface-2); color:var(--primary-dark); font-weight:800; padding:9px 7px; text-align:right; border-bottom:2px solid var(--border); white-space:nowrap;}
tbody td{padding:8px 7px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody tr.open{background:#FFF9EC;}
.table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--border);}
.empty-row td{text-align:center; color:var(--muted); padding:22px;}

.toast-wrap{position:fixed; bottom:22px; left:22px; z-index:999; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--text); color:#fff; padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:700; box-shadow:0 6px 18px rgba(0,0,0,.18);}
.toast.success{background:var(--success);} .toast.error{background:var(--danger);}
</style>
</head>
<body>

<!-- ===== MAIN APP ===== -->
<div id="appScreen" class="app-wrap">
  <div class="topbar">
    <div class="brand"><div class="mark">🕒</div><div class="txt">تسجيل الحضور والانصراف</div></div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="badge green" id="connBadge"><span class="dot green"></span> متصل</span>
      <span class="clock" id="clockDisplay">--:--:--</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">تسجيل عملية جديدة</div>
    <div class="card-desc">اكتب اسم الموظف (هيظهرلك اقتراحات)، ولو الاسم معروف هتتملى الوظيفة تلقائي</div>
    <div class="field">
      <label>اسم الموظف</label>
      <input type="text" id="empName" list="employeesList" placeholder="ابدأ الكتابة..." oninput="onNameInput()">
      <datalist id="employeesList"></datalist>
    </div>
    <div class="field">
      <label>الوظيفة</label>
      <select id="empRole" onchange="onRoleChange()">
        <option value="">اختر الوظيفة</option>
        <option value="إداري">إداري</option>
        <option value="معاونات">معاونات</option>
        <option value="مخزن">مخزن</option>
        <option value="حسابات">حسابات</option>
        <option value="ريسيبشن">ريسيبشن</option>
        <option value="تمريض داخلي">تمريض داخلي</option>
        <option value="تمريض عمليات">تمريض عمليات</option>
        <option value="تمريض حضانه">تمريض حضانه</option>
        <option value="طبيب مقيم نسا">طبيب مقيم نسا</option>
        <option value="طبيب مقيم اطفال">طبيب مقيم حضانة</option>
        <option value="طبيب مقيم اطفال">طبيب مقيم اطفال</option>
      </select>
      <div class="auto-note" id="autoNoteRole">تم تحديد الوظيفة تلقائيًا من بيانات الموظف ✓</div>
    </div>
    <div class="field hidden" id="f_shift">
      <label>الشيفت (مطلوب لوظائف التمريض)</label>
      <select id="empShift">
        <option value="">اختر الشيفت</option>
        <option value="AB">AB (8 صباحًا - 8 مساءً)</option>
        <option value="C">C (8 مساءً - 8 صباحًا)</option>
        <option value="ABC">ABC (24 ساعة كاملة)</option>
      </select>
    </div>
    <div class="action-btns">
      <button class="btn-checkin" id="btnCheckin" onclick="checkIn()"><span class="ic">✅</span> تسجيل حضور</button>
      <button class="btn-checkout" id="btnCheckout" onclick="checkOut()"><span class="ic">🚪</span> تسجيل انصراف</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="card">
    <div class="card-title">سجل اليوم <button class="btn btn-outline btn-sm" style="float:left;" onclick="loadToday()">🔄 تحديث</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>الاسم</th><th>الوظيفة</th><th>الشيفت</th><th>حضور</th><th>انصراف</th><th>عدد الساعات</th><th>الحالة</th></tr></thead>
      <tbody id="todayTbody"></tbody>
    </table></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   تسجيل الحضور والانصراف - نسخة Cloudflare (D1 + Pages Functions)
   ============================================================ */

/* موقع المركز - نفس الإحداثيات السابقة، عدّلها هنا لو احتجت */
const GEOFENCE = { lat: 30.484016586918354, lng: 31.18426185270352, radius: 250 };
const NURSING_ROLES = ['تمريض داخلي', 'تمريض عمليات', 'تمريض حضانه'];

let employeesData = []; // [{employee_id, employee_name, job_title}]

function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
}
function toast(msg, type){
  type = type || 'success';
  const wrap = $('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 3800);
}
function showStatus(msg, type){
  const el = $('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg show ' + type;
  setTimeout(()=>{ el.classList.remove('show'); }, 5000);
}
function setConn(ok){
  const b = $('connBadge');
  if(ok){ b.innerHTML = '<span class="dot green"></span> متصل'; b.className='badge green'; }
  else { b.innerHTML = '<span class="dot red"></span> تعذر الاتصال بقاعدة البيانات'; b.className='badge red'; }
}
function setButtonsBusy(busy){
  $('btnCheckin').disabled = busy;
  $('btnCheckout').disabled = busy;
}

setInterval(updateClock, 1000);
function updateClock(){
  const el = $('clockDisplay');
  if(!el) return;
  const d = new Date();
  el.textContent = `${todayStr()}  ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
updateClock();

/* ---------------- geofence verification ---------------- */
function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}
function getCurrentPositionPromise(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('المتصفح ده مش بيدعم تحديد الموقع الجغرافي')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      err => reject(err),
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  });
}
function geoErrorMessage(err){
  if(err && err.code === 1) return 'لازم توافق على السماح بالوصول لموقعك الجغرافي عشان تقدر تسجل';
  if(err && err.code === 2) return 'تعذر تحديد موقعك الحالي، تأكد إن خدمة الموقع (GPS) شغالة';
  if(err && err.code === 3) return 'استغرق تحديد الموقع وقت طويل، حاول تاني';
  return (err && err.message) || 'حدث خطأ في تحديد الموقع';
}
async function verifyLocationOrFail(){
  showStatus('جاري التأكد من موقعك الحالي...', 'success');
  let coords;
  try{
    coords = await getCurrentPositionPromise();
  }catch(err){
    showStatus(geoErrorMessage(err), 'error');
    return null;
  }
  const distance = haversineMeters(coords.latitude, coords.longitude, GEOFENCE.lat, GEOFENCE.lng);
  if(distance > GEOFENCE.radius){
    showStatus(`لازم تكون داخل نطاق المركز عشان تسجل. المسافة الحالية عن المركز: ${Math.round(distance)} متر (المسموح: ${GEOFENCE.radius} متر)`, 'error');
    return null;
  }
  return { lat: coords.latitude, lng: coords.longitude, distance: distance };
}

/* ---------------- app entry ---------------- */
document.addEventListener('DOMContentLoaded', ()=>{
  loadEmployees();
  loadToday();
});

/* ---------------- API calls (نفس الدومين، مفيش مشاكل CORS) ---------------- */
async function apiGet(path){
  try{
    const res = await fetch(path);
    const data = await res.json();
    setConn(true);
    return data;
  }catch(err){
    console.error(err);
    setConn(false);
    return null;
  }
}
async function apiPost(path, payload){
  try{
    const res = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    setConn(true);
    return data;
  }catch(err){
    console.error(err);
    setConn(false);
    return { error: 'تعذر الاتصال بقاعدة البيانات، تأكد من الإنترنت وحاول تاني' };
  }
}

/* ---------------- employees & auto-fill job title ---------------- */
async function loadEmployees(){
  const data = await apiGet('/api/employees');
  if(data && data.employees){
    employeesData = data.employees;
    $('employeesList').innerHTML = employeesData.map(e=> `<option value="${escapeHtml(e.employee_name)}">`).join('');
  }
}
function onNameInput(){
  const name = $('empName').value.trim();
  const match = employeesData.find(e => e.employee_name === name);
  const roleSelect = $('empRole');
  const note = $('autoNoteRole');
  if(match && match.job_title){
    roleSelect.value = match.job_title;
    note.classList.add('show');
    onRoleChange();
  }else{
    note.classList.remove('show');
  }
}
function onRoleChange(){
  const role = $('empRole').value;
  const shiftField = $('f_shift');
  if(NURSING_ROLES.includes(role)){
    shiftField.classList.remove('hidden');
  }else{
    shiftField.classList.add('hidden');
    $('empShift').value = '';
  }
}

/* ---------------- today log ---------------- */
function computeHoursDisplay(inTime, outTime){
  if(!inTime || !outTime) return '';
  const inP = String(inTime).split(':').map(Number);
  const outP = String(outTime).split(':').map(Number);
  if(inP.length<2 || outP.length<2) return '';
  let hours = ((outP[0]*60+outP[1]) - (inP[0]*60+inP[1])) / 60;
  if(hours < 0) hours += 24;
  return Math.round(hours*100)/100;
}
async function loadToday(){
  const data = await apiGet('/api/today');
  const tbody = $('todayTbody');
  if(!data || !data.rows){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">تعذر تحميل السجل، تأكد من الاتصال</td></tr>`;
    return;
  }
  if(data.rows.length===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">لا يوجد تسجيلات اليوم بعد</td></tr>`;
    return;
  }
  tbody.innerHTML = data.rows.map(r=>{
    const hours = computeHoursDisplay(r.attendance_time, r.leaving_time);
    return `
    <tr class="${!r.leaving_time?'open':''}">
      <td>${escapeHtml(r.employee_name)}</td>
      <td>${escapeHtml(r.job_title)}</td>
      <td>${escapeHtml(r.shift)}</td>
      <td>${escapeHtml(r.attendance_time)}</td>
      <td>${r.leaving_time ? escapeHtml(r.leaving_time) : '<span class="badge green">لسه شغال</span>'}</td>
      <td>${hours}</td>
      <td>${r.status==='منصرف' ? '<span class="badge green">منصرف</span>' : '<span class="badge red">حاضر</span>'}</td>
    </tr>`;
  }).join('');
}

/* ---------------- check-in / check-out ---------------- */
async function checkIn(){
  const name = $('empName').value.trim();
  const role = $('empRole').value;
  const shift = $('empShift').value;
  if(!name){ showStatus('من فضلك اكتب اسم الموظف', 'error'); return; }
  if(!role){ showStatus('من فضلك اختر الوظيفة', 'error'); return; }
  if(NURSING_ROLES.includes(role) && !shift){ showStatus('من فضلك اختر الشيفت', 'error'); return; }

  setButtonsBusy(true);
  const loc = await verifyLocationOrFail();
  if(!loc){ setButtonsBusy(false); return; }
  const data = await apiPost('/api/checkin', { name, job_title: role, shift, lat: loc.lat, lng: loc.lng, distance: loc.distance });
  setButtonsBusy(false);
  if(!data){ showStatus('تعذر الاتصال بقاعدة البيانات، تأكد من الإنترنت', 'error'); return; }
  if(data.error){ showStatus(data.error, 'error'); return; }
  showStatus(`تم تسجيل حضور ${name} الساعة ${data.time} (شيفت ${data.shift})`, 'success');
  $('empName').value = '';
  $('empRole').value = '';
  $('autoNoteRole').classList.remove('show');
  onRoleChange();
  loadToday();
}
async function checkOut(){
  const name = $('empName').value.trim();
  if(!name){ showStatus('من فضلك اكتب اسم الموظف', 'error'); return; }

  setButtonsBusy(true);
  const loc = await verifyLocationOrFail();
  if(!loc){ setButtonsBusy(false); return; }
  const data = await apiPost('/api/checkout', { name, lat: loc.lat, lng: loc.lng, distance: loc.distance });
  setButtonsBusy(false);
  if(!data){ showStatus('تعذر الاتصال بقاعدة البيانات، تأكد من الإنترنت', 'error'); return; }
  if(data.error){ showStatus(data.error, 'error'); return; }
  showStatus(`تم تسجيل انصراف ${name} الساعة ${data.time}`, 'success');
  $('empName').value = '';
  loadToday();
}

</script>
</body>
</html>
